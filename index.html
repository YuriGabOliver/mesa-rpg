<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110e">
<title>Mesa Leve</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🗺️%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<section id="home" class="tela">
  <div class="home-box">
    <h1>🗺️ Mesa Leve</h1>
    <p class="sub">Mapa, tokens, névoa e dados para a sua mesa de RPG. Sem cadastro: é só criar e mandar o link.</p>

    <div id="h-convite" hidden>
      <h2>Você foi convidado para uma mesa</h2>
      <label>Seu nome<input id="hc-nome" maxlength="20" placeholder="Como os outros vão ver você"></label>
      <button class="b prim" id="hc-entrar">Entrar na mesa</button>
    </div>

    <div id="h-principal">
      <h2>Criar mesa nova</h2>
      <label>Seu nome<input id="h-nome" maxlength="20" placeholder="Seu nome"></label>
      <label>Nome da mesa<input id="h-mesa" maxlength="40" placeholder="Ex.: Rancho Boa Vista"></label>
      <button class="b prim" id="h-criar">Criar mesa (serei o mestre)</button>

      <h2>Entrar em uma mesa</h2>
      <label>Link ou código da mesa<input id="h-cod" placeholder="Cole o link aqui"></label>
      <button class="b" id="h-entrar">Entrar</button>

      <div id="h-recentes" hidden><h2>Suas mesas</h2><ul id="h-lista"></ul></div>
    </div>
    <p id="h-erro" class="erro" hidden></p>
  </div>
</section>

<section id="mesa" class="tela" hidden>
  <header id="topo">
    <b id="t-nome"></b><span id="t-papel" class="tag"></span><span id="t-cena" class="tag cena" hidden></span><span id="t-off" class="tag aviso" hidden>sem conexão</span>
    <span class="flex"></span>
    <button class="b" id="t-som" hidden></button>
    <button class="b" id="t-conv">Convidar</button>
    <button class="b" id="t-painel">Painel</button>
  </header>
  <main id="area">
    <div id="palco">
      <canvas id="cv"></canvas>
      <canvas id="cv-clima" aria-hidden="true"></canvas>
      <div id="tools">
        <button class="b on" data-f="mover" title="Mover mapa e tokens">Mover</button>
        <button class="b" data-f="regua" title="Medir distância">Régua</button>
        <button class="b" data-f="nevoa" id="tool-nevoa" hidden title="Revelar área da névoa">Revelar</button>
        <button class="b" id="tool-centro" title="Centralizar o mapa">Centralizar</button>
      </div>
      <div id="tools-nevoa" hidden>
        <button class="b on" data-na="r">Revelar</button><button class="b" data-na="h">Esconder</button>
        <span class="sep"></span>
        <button class="b on" data-nm="rect">Retângulo</button><button class="b" data-nm="circ">Círculo</button><button class="b" data-nm="pincel">Pincel</button>
        <label class="raio">Pincel <input type="range" id="n-raio" min="10" max="200" value="40"></label>
        <button class="b" id="n-desfaz">Desfazer</button>
      </div>
      <div id="faixa" hidden><span id="faixa-txt"></span><button class="b prim mini" id="faixa-puxar">Puxar jogadores para cá</button></div>
    </div>
    <aside id="painel">
      <nav id="abas"></nav>
      <div id="conteudo"></div>
    </aside>
  </main>
</section>

<div id="toast" role="status"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
